name: Release

# Required repository secrets:
# DOOTASK_USERNAME
# DOOTASK_PASSWORD
# DOCKER_USERNAME
# DOCKER_PASSWORD

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (proxy)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            dootask/memos
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push proxy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Self-built Memos image (sub-path patched). Tagged by the upstream Memos
      # version pinned in memos-server/Dockerfile and referenced by docker-compose.yml.
      - name: Build and push Memos server image
        uses: docker/build-push-action@v7
        with:
          context: ./memos-server
          file: ./memos-server/Dockerfile
          push: true
          tags: dootask/memos-server:0.29.0
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=memos-server
          cache-to: type=gha,scope=memos-server,mode=max

      - name: Create dootask-plugin tar.gz package
        run: |
          cd dootask-plugin
          mv version "${{ github.ref_name }}"
          tar -czf ../dootask-plugin.tar.gz .
          cd ..
          echo "Package created: dootask-plugin.tar.gz"
          ls -la dootask-plugin.tar.gz

      - name: Publish to DooTask App Store
        id: publish
        uses: dootask/appstore-action@v2
        with:
          username: ${{ secrets.DOOTASK_USERNAME }}
          password: ${{ secrets.DOOTASK_PASSWORD }}
          appid: 'memos'
          package_file: './dootask-plugin.tar.gz'
          draft: false
