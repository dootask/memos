fields:
  - name: MEMOS_ADMIN_USER_IDS
    label:
      en: Administrators
      zh: 管理员
    placeholder:
      en: Select users to grant Memos admin privileges
      zh: 选择授予 Memos 管理员权限的用户
    description:
      en: These DooTask users become Memos administrators; everyone else signs in as a regular user.
      zh: 选中的 DooTask 用户将成为 Memos 管理员，其余用户以普通成员身份登录。
    type: user_select
  - name: INTERNAL_SECRET
    label:
      en: Internal Secret
      zh: 内部密钥
    description:
      en: Used to derive account passwords and sign sessions. Keep it stable; do not change after install.
      zh: 用于派生账号密码与签名会话，安装后请保持不变。
    type: password
    default: $random:48

menu_items:
  - location: application
    label:
      en: Memos
      zh: Memos 笔记
    url: "apps/memos/dootask-sso?token={user_token}&lang={system_lang}&theme={system_theme}"
    url_type: iframe
    immersive: true
    # Hide DooTask's floating capsule (it overlaps the Memos header). The
    # "Close app" action lives in the Memos left sidebar instead.
    capsule:
      visible: false
