# Served under the DooTask main origin at /apps/memos/. The trailing slash on
# proxy_pass strips the /apps/memos/ prefix, so the proxy (and Memos behind it)
# always see root-relative paths; the frontend bakes the /apps/memos prefix into
# the URLs it builds in the browser.

# Live-refresh SSE stream: no buffering, long timeout.
location = /apps/memos/api/v1/sse {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    chunked_transfer_encoding off;
    proxy_pass http://memos-proxy:7070/api/v1/sse;
}

location /apps/memos/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://memos-proxy:7070/;
}
